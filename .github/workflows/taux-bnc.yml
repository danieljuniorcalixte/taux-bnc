name: Taux BNC

on:
  schedule:
    # Du lundi au samedi (heure UTC ; en hiver, Haïti est à UTC-5 : 12 h 17 UTC = 7 h 17 à Port-au-Prince).
    # Le matin toutes les 30 minutes de 7 h 17 à 11 h 47, puis à 12 h 17, 14 h 17 et 16 h 17 (heure d'Haïti).
    # GitHub ne garantit pas chaque passage : plusieurs passages assurent la lecture. Le robot n'écrit que si le taux change.
    - cron: '17,47 12-16 * * 1-6'
    - cron: '17 17,19,21 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taux-bnc
  cancel-in-progress: false

jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lire le taux de la BNC
        run: node lire-taux-bnc.mjs
      - name: Enregistrer le nouveau taux
        run: |
          if [ -n "$(git status --porcelain -- taux-bnc.json historique.csv)" ]; then
            git config user.name "robot-taux"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add taux-bnc.json historique.csv
            git commit -m "Taux BNC du $(node -p "require('./taux-bnc.json').date")"
            git push
          fi
